[project]
name = "nexus-gateway-live-tests"
version = "0"
description = "Standalone LangChain agent smoke tests against the nexus-gateway Worker (:4001)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-openai>=1.2,<2",
    "langchain-anthropic>=1.4,<2",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "websockets>=13",
    "rich>=13",
]

[tool.pytest.ini_options]
# Run all cases concurrently by default (they're independent network-bound LLM
# calls). Override with e.g. `-n 0` to run serially. Wall time floors at the
# slowest single test (a reasoning model's 2-turn tool loop).
addopts = "-n auto"
